[package]
name = "spotify-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# librespot-core 0.8's build script breaks if Cargo picks vergen 9.1
# (that release switched vergen-lib majors). Keep the 9.0 line.
vergen = "=9.0.6"
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
rubato = { version = "0.15.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
