services:
  # Empty named volumes are created as root; Lavalink runs as uid 322 and
  # cannot download plugins until the mount is writable by that user.
  lavalink-plugins-init:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - lavalink-plugins:/plugins
    command: ["chown", "-R", "322:322", "/plugins"]
    restart: "no"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: music-bot-lavalink
    restart: unless-stopped
    depends_on:
      lavalink-plugins-init:
        condition: service_completed_successfully
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    networks:
      - music-bot
    # Published for local/WSL bots running on the host (npm start)
    ports:
      - "2333:2333"

  bot:
    build: .
    container_name: music-bot
    restart: unless-stopped
    depends_on:
      - lavalink
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
      DEBUG: ${DEBUG:-false}
    networks:
      - music-bot

volumes:
  lavalink-plugins:

networks:
  music-bot:
    driver: bridge
